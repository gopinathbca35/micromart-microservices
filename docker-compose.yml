services:
  user-service:
    image: ${ECR_REGISTRY}/user-service:${IMAGE_TAG}
    environment:
      DB_PATH: /data/users.sqlite
    volumes:
      - user_data:/data
    restart: unless-stopped
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/users/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  product-service:
    image: ${ECR_REGISTRY}/product-service:${IMAGE_TAG}
    environment:
      DB_PATH: /data/products.sqlite
    volumes:
      - product_data:/data
    restart: unless-stopped
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/api/products/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  order-service:
    image: ${ECR_REGISTRY}/order-service:${IMAGE_TAG}
    environment:
      DB_PATH: /data/orders.sqlite
    volumes:
      - order_data:/data
    restart: unless-stopped
    expose:
      - "5002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/api/orders/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    image: ${ECR_REGISTRY}/frontend-service:${IMAGE_TAG}
    ports:
      - "80:80"
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    restart: unless-stopped
    
  prometheus:
   image: prom/prometheus:latest
   container_name: prometheus
   restart: unless-stopped
   volumes:
     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
     - prometheus_data:/prometheus
   ports:
     - "127.0.0.1:9090:9090"

 grafana:
   image: grafana/grafana:latest
   container_name: grafana
   restart: unless-stopped
   volumes:
     - grafana_data:/var/lib/grafana
   ports:
     - "127.0.0.1:3000:3000"
   depends_on:
     - prometheus

 node-exporter:
   image: prom/node-exporter:latest
   container_name: node-exporter
   restart: unless-stopped
   network_mode: host
   pid: host
   command:
     - '--path.rootfs=/host'
   volumes:
     - '/:/host:ro,rslave'   

volumes:
  user_data:
  product_data:
  order_data:
  prometheus_data:
  grafana_data:
